name: Censo CI

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'supabase/functions/censo-oficial-bridge/**'
      - 'supabase/migrations/20260914_censo_integracao_direta_segura.sql'
      - '.github/workflows/censo-ci.yml'

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:censo-direto
      - run: npm run test:educacenso
      - run: npm run build
