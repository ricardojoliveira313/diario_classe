name: Patch modalidade Censo

on:
  push:
    branches:
      - fix/censo-ficha-mais-recente-primeiro

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'feat: preencher modalidade automaticamente no Censo')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/censo-ficha-mais-recente-primeiro
          fetch-depth: 0

      - name: Aplicar correção
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('frontend/src/pages/EducacensoDocentes.tsx')
          s=p.read_text(encoding='utf-8')
          old="function modalidadeSugerida(s:Servidor,f:Frequencia,turmas:Turma[]){const cargo=norm(f.cargo||s.cargo),lotacao=norm(f.lotacao),nomes=turmas.map(t=>norm(t.nome));if(cargo.includes('EDUCACAO FISICA'))return'Educação Física';if(cargo.includes('ART'))return'Arte – Regular';if(cargo.includes('ATENDIMENTO EDUCACIONAL ESPECIALIZADO')||turmas.some(t=>norm(t.tipo)==='AEE'))return'';if(lotacao.includes('EJA')||nomes.some(n=>n.includes('EJA')))return'EJA I';if(lotacao.includes('PRE ESCOLA')||nomes.some(n=>/^[12] ETAPA\\b/.test(n)))return'Educação Infantil';if(nomes.some(n=>/^[1-5] ANO\\b/.test(n)))return'Ensino Fundamental Regular';return''}"
          new="function modalidadeSugerida(s:Servidor,f:Frequencia,turmas:Turma[]){const cargo=norm(f.cargo||s.cargo),lotacao=norm(f.lotacao),nomes=turmas.map(t=>norm(t.nome));if(cargo.includes('EDUCACAO FISICA'))return'Educação Física';if(cargo.includes('ART'))return'Arte – Regular';if(cargo.includes('ATENDIMENTO EDUCACIONAL ESPECIALIZADO')||turmas.some(t=>norm(t.tipo)==='AEE'))return'';if(lotacao.includes('EJA')||nomes.some(n=>n.includes('EJA')))return'EJA I';if(lotacao.includes('PRE ESCOLA')||nomes.some(n=>/^[12] ETAPA\\b/.test(n)))return'Educação Infantil';if(nomes.some(n=>/^[1-5] ANO\\b/.test(n)))return'Ensino Fundamental Regular';if(cargo.includes('EDUCACAO INFANTIL')&&cargo.includes('ENSINO FUNDAMENTAL'))return'Educação Básica I';if(cargo.includes('EDUCACAO INFANTIL'))return'Educação Infantil';if(cargo.includes('ENSINO FUNDAMENTAL'))return'Ensino Fundamental Regular';return''}"
          if old not in s:
              raise SystemExit('Função modalidadeSugerida esperada não encontrada')
          s=s.replace(old,new,1)
          old2="modalidade:'',cpf:dig(official.cpf||f.cpf||p.cpf),"
          new2="modalidade:l.modalidade||modalidadeSugerida(l.servidor,l.frequencia,l.turmas),cpf:dig(official.cpf||f.cpf||p.cpf),"
          if old2 not in s:
              raise SystemExit('Inicialização de modalidade não encontrada')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Instalar dependências e validar build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Commitar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/patch-modalidade-censo.yml
          git add -A
          git commit -m "feat: preencher modalidade automaticamente no Censo"
          git push origin HEAD:fix/censo-ficha-mais-recente-primeiro
