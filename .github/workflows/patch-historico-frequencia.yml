name: Patch histórico frequência

on:
  push:
    branches:
      - fix/historico-presencas-ausencias-auto

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/historico-presencas-ausencias-auto
          fetch-depth: 0

      - name: Aplicar patch
        run: python scripts/patch_historico_frequencia.py

      - name: Instalar dependências
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Validar build
        working-directory: frontend
        run: npm run build

      - name: Commitar alteração final
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/patch-historico-frequencia.yml scripts/patch_historico_frequencia.py
          git add -A
          git commit -m "feat: calcular presenças e ausências no histórico"
          git push origin HEAD:fix/historico-presencas-ausencias-auto
