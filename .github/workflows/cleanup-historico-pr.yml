name: Cleanup histórico PR

on:
  push:
    branches:
      - fix/historico-presencas-ausencias-auto

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/historico-presencas-ausencias-auto
          fetch-depth: 0
      - name: Restaurar lockfile do main
        run: |
          git fetch origin main
          git checkout origin/main -- frontend/package-lock.json
          rm -f .github/workflows/cleanup-historico-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remover alteração incidental do lockfile"
          git push origin HEAD:fix/historico-presencas-ausencias-auto
